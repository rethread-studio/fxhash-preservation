[project]
name = "swhprep"
version = "0.1.0"
description = "Turn plain source folders into a Software Heritage crawlable git forge (grokmirror manifest)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
swhprep = "swhprep.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swhprep"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
