# Generic HTTP-only server for a swhprep forge (used by scripts/e2e_nginx.sh).
# For production with TLS see deploy/fxhash.gakoy.com.
#
#   apt install nginx fcgiwrap git
#   cp deploy/swh-git-locations.conf /etc/nginx/snippets/
#   swhprep manifest /srv/git /srv/git/manifest.js.gz

server {
    listen 80;
    server_name git.example.org;
    root /srv/git;

    include /etc/nginx/snippets/swh-git-locations.conf;

    location / {
        return 404;
    }
}
