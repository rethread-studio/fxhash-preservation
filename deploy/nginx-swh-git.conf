# Serve bare repos under /srv/git over smart HTTP (git-http-backend via fcgiwrap),
# plus the grokmirror manifest that the Software Heritage "grokmirror" lister fetches.
#
#   apt install nginx fcgiwrap git
#   swhprep manifest /srv/git /srv/git/manifest.js.gz
#   Add Forge Now: type "grokmirror", URL https://git.example.org/
#
# Software Heritage crawls from 128.93.166.0/26 (IPv4): keep it out of any rate limit,
# fail2ban jail or bot challenge placed in front of this server.

server {
    listen 80;
    # listen 443 ssl; ssl_certificate ...; ssl_certificate_key ...;
    server_name git.example.org;

    root /srv/git;

    # Manifest. The SWH lister sends If-Modified-Since = time of its previous listing,
    # not our Last-Modified, so nginx's default "exact" matching would never answer 304.
    location = /manifest.js.gz {
        default_type application/gzip;
        if_modified_since before;
    }

    # Smart HTTP, read-only: refs advertisement and upload-pack (clone/fetch) only.
    location ~ ^/(.+\.git)/(info/refs|git-upload-pack)$ {
        client_max_body_size 0;
        fastcgi_pass unix:/run/fcgiwrap.socket;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT /srv/git;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param PATH_INFO $uri;
        fastcgi_param GIT_PROTOCOL $http_git_protocol;
        # repos are owned by the converting user, not by fcgiwrap's user
        fastcgi_param GIT_CONFIG_COUNT 1;
        fastcgi_param GIT_CONFIG_KEY_0 safe.directory;
        fastcgi_param GIT_CONFIG_VALUE_0 *;
        fastcgi_buffering off;
        fastcgi_read_timeout 3600;
    }

    # Pushes are never served.
    location ~ /git-receive-pack$ {
        return 403;
    }

    # Dumb-HTTP fallback (objects, packs, HEAD) is served as static files.
    location ~ ^/.+\.git/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
